<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collecte Sanitaire 🏥</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
        .logo { font-size: 50px; margin-bottom: 10px; }
        label { display: block; text-align: left; margin: 10px 0 5px; color: #34495e; font-weight: bold; }
        select, input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #dcdde1; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🩺</div>
        <h1>Collecte Sanitaire</h1>
        <form action="/envoyer" method="POST">
            <label>📍 Zone de santé</label>
            <select name="zone">
                <option value="Littoral">Littoral (Douala)</option>
                <option value="Centre">Centre (Yaoundé)</option>
                <option value="Ouest">Ouest (Bafoussam)</option>
            </select>

            <label>👤 Âge du patient</label>
            <input type="number" name="age" placeholder="Ex: 25" required>

            <label>🤒 Diagnostic suspect</label>
            <select name="maladie">
                <option value="Paludisme">Paludisme 🦟</option>
                <option value="Grippe">Grippe 🌡️</option>
                <option value="Autre">Autre 📋</option>
            </select>

            <button type="submit">🚀 Enregistrer la donnée</button>
        </form>
    </div>
</body>
</html>
