<!DOCTYPE html>
<html lang="fr">
<head>

   <meta charset="UTF-8">
   <title>Collecte sanitaire</title>
     <style>
     
      body {font-family:
      sans-serif; background-color: #eef2f3;
      display: flex; justify-content:
      center; padding-top: 50px; }
      .form-container {background:
      white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px
      rgba(0,0,0,0,1); width: 350px;  }
         h2 { color: #2c3e50;
       text-align: center; }
          label{ display: block;
          margin-top: 15px; font-weight: bold; }
          input, slect, button {width: 100%; padding: 10px; margin-top: 5px;
          border-radius: 5px; border: 1px solid
          #ccc; box-sizing: border-box; }
          
            butotn { background-color: #3498db; color: white; border: none;
            margin-top: 20px; cursor: pointer; 
            font-size: 16px;}
            
              button:hover
              { background-color: #2980b9; }
           </style>
           </head>
           
             <body>
                 <div class="form-container">
                 <h2> Collecte Sanitaire</h2>
                 <form action="/envoyer" method="POST">
                 
                         <label>Zone de sante</label>
                         <select name="zone">
                            <option
                            value="Littoral">Littoral (Douala)</option>
                            <option 
                            value="Centre">Centre (Yaounde)</option>
                            <option
                            value="Ouest">Ouest (Bafoussam)</option>
                            
                                 </select>
                                 
                                 <label>Age du patient</label>
                                 
                                 <input type="number" name="age" required min="0">
                                 <label>Diagnostic suspect</label>
                                 
                                 <select name="maladie">
                                 
                                    <option
                                    value="Paludisme">Paludisme</option>
                                    <option
                                    value="Cholera">Cholera</option>
                                    <option
                                    value="Fievre jaune">Fievre jaune</option>
                                   </select>
                                   
                                   <button>
                           type="submit">Enregistrer la donnee</button>
                                </form>
                               </div>
                              </body>
                             </html>
